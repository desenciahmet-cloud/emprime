<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fav_cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="fav_emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="fav_magenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <filter id="fav_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00f2fe" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer Dark Squircle Container -->
  <rect width="64" height="64" rx="16" fill="#090e17" stroke="#1e293b" stroke-width="1"/>
  
  <g transform="translate(5, 5)">
    <!-- Layer 1: Magenta Plate (Rotated +6 deg) -->
    <rect x="10" y="2" width="44" height="44" rx="13" fill="url(#fav_magenta)" opacity="0.85" transform="rotate(6 32 24)"/>
    <!-- Layer 2: Emerald Plate (Rotated -3 deg) -->
    <rect x="4" y="5" width="44" height="44" rx="13" fill="url(#fav_emerald)" opacity="0.9" transform="rotate(-3 26 27)"/>
    <!-- Layer 3: Cyan Foreground Plate with Glow -->
    <rect x="0" y="7" width="44" height="44" rx="13" fill="url(#fav_cyan)" filter="url(#fav_glow)"/>
    
    <!-- Stylized Modern 'e' Cutout in Center -->
    <path d="M29 22 C22 22 17 26 17 32 C17 38 22 42 29 42 C33 42 36.5 40 38.5 37.5 L34 34.5 C33 35.8 31.2 36.8 29 36.8 C25.5 36.8 22.5 34.2 22 30.5 L40.5 30.5 C40.7 30 40.7 29.5 40.7 28.8 C40.7 24 36 22 29 22 Z M22.2 27.2 C23.2 24.5 25.8 23.5 29 23.5 C32 23.5 34.5 24.5 35.5 27.2 L22.2 27.2 Z" fill="#090e17"/>
    
    <!-- Serigraphy Registration Crosshair (Top Right) -->
    <circle cx="44" cy="10" r="5" fill="none" stroke="#ffffff" stroke-width="1.8"/>
    <line x1="44" y1="2" x2="44" y2="18" stroke="#ffffff" stroke-width="1.8"/>
    <line x1="36" y1="10" x2="52" y2="10" stroke="#ffffff" stroke-width="1.8"/>
    <circle cx="44" cy="10" r="1.5" fill="#ffffff"/>
  </g>
</svg>